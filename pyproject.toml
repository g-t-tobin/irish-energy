[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irish-energy-analytics"
version = "0.1.0"
description = "Irish Energy Analytics Data Platform"
authors = [
    {name = "Irish Energy Team"},
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3>=1.26.0",
    "aws-cdk-lib>=2.0.0",
    "constructs>=10.0.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
    "pydantic>=1.10.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "moto>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 88
extend-ignore = ['E203', 'W503']
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "infrastructure/cdk.out",
    "build",
    ".venv",
    "venv",
    ".git",
]
