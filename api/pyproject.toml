[tool.poetry]
name = "irish-energy-api"
version = "0.1.0"
description = "FastAPI backend for Irish Energy Analytics Platform"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.23.2"
boto3 = "^1.29.152"
pandas = "^2.1.3"
pyarrow = "^14.0.2"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-mock = "^3.11.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"